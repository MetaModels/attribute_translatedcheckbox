services:
    metamodels.attribute_translatedcheckbox.attribute_type_factory:
        class: MetaModels\AttributeTranslatedCheckboxBundle\Attribute\AttributeTypeFactory
        arguments:
            - "@database_connection"
            - "@metamodels.table_manipulator"
        tags:
            - { name: metamodels.attribute_factory }

    netzmacht.attribute_translated_checkbox.filter_setting_factory:
        alias: '@MetaModels\AttributeTranslatedCheckboxBundle\FilterSetting\Published\TranslatedCheckboxFilterSettingTypeFactory'
        deprecated:
            package: metamodels/attribute_translatedcheckbox
            version: 2.3
            message:
                The service "%service_id%" is deprecated and to be removed in MetaModels 3 - The name was never correct.
                Use the '%alias_id%' service instead.

    MetaModels\AttributeTranslatedCheckboxBundle\FilterSetting\Published\TranslatedCheckboxFilterSettingTypeFactory:
      arguments:
        - '@event_dispatcher'
        - '@MetaModels\Filter\FilterUrlBuilder'
        - '@translator'
      tags:
            - { name: metamodels.filter_factory }

    MetaModels\AttributeTranslatedCheckboxBundle\Translator\TranslationLoader:
      arguments:
        $baseTranslator: '@contao.translation.translator'
        $builder: '@metamodels.view_combination.input_screen_information_builder'
      tags: [ { name: metamodels.translation-loader } ]
